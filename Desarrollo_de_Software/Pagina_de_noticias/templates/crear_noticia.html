{% extends 'base.html' %}

{% block title %}Redactar Noticia{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Publicar Nueva Noticia</h2>
    <form action="{{ url_for('crear_noticia') }}" method="POST" class="form-noticia">
        <label>Título:</label>
        <input type="text" name="titulo" required placeholder="Título de la noticia">

        <label>Subtítulo / Bajada:</label>
        <input type="text" name="subtitulo" placeholder="Breve resumen">

        <label>Categoría:</label>
        <select name="categoria">
            <option value="Nacional">Nacional</option>
            <option value="Internacional">Internacional</option>
            <option value="Política">Política</option>
            <option value="Cultura">Cultura</option>
            <option value="Opinión">Opinión</option>
        </select>

        <label>Contenido:</label>
        <textarea name="contenido" rows="8" required placeholder="Escribe el texto completo aquí..."></textarea>

        <button type="submit">Publicar Noticia</button>
    </form>
</section>
{% endblock %}
