<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal Periodístico{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <a href="{{ url_for('index') }}">📰 Portal Informativo</a>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('crear_noticia') }}" class="btn-redactar">+ Redactar Noticia</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Portal de Noticias - Todos los derechos reservados.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
