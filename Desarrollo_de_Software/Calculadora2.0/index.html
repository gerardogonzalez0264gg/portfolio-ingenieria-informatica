<html>

    <head>

        <title>calculadora2.0</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <h1>Calculadora2.0</h1>

        <div class="calculadora">

            <input type="text" id="pantalla" readonly>

            <div class="botons">

                <button type="text" onclick="agregar(7)">7</button>
                <button type="text" onclick="agregar(8)">8</button>
                <button type="text" onclick="agregar(9)">9</button>
                <button type="text" onclick="agregar('/')">/</button>
                
                <button type="text" onclick="agregar(4)">4</button>
                <button type="text" onclick="agregar(5)">5</button>
                <button type="text" onclick="agregar(6)">6</button>
                <button type="text" onclick="agregar('*')">x</button>

                <button type="text" onclick="agregar(1)">1</button>
                <button type="text" onclick="agregar(2)">2</button>
                <button type="text" onclick="agregar(3)">3</button>
                <button type="text" onclick="agregar('+')">+</button>

                <button type="text" onclick="agregar(0)">0</button>
                <button type="text" onclick="limpiar()">d</buttom>
                <button type="text" onclick="agregar('-')">-</button>
                <button type="text" onclick="calcular()">=</button>

            </div>
        </div>

    </body>

    <script src="script.js"></script>

</html>
